# Example station configuration, with placeholder values. Run with `va3ujf --config example.toml`
# startup_reflector = "DCS999 A"

http_listen = "0.0.0.0:8080"

[station]
callsign = "N0CALL"
module = "B"
frequency_mhz = 446.5
latitude = 45.0
longitude = -90.0

[modem]
port = "/dev/ttyS0"

# Signal levels need firmware built with SEND_RSSI_DATA, and MMDVMHost's RSSI.dat to turn the modem's raw readings into dBm
# rssi_file = "/etc/va3ujf/RSSI.dat"

# Answers an RF user who lets go of the PTT with a short transmission of its own, like MMDVMHost's ack. It says "ACK BER 0.3% -87dBm",
# with the dBm only if the modem reports signal levels. Left out, nobody is answered
# [ack]
# delay_ms = 750

[aprs]
server = "noam.aprs2.net:14580"

# Pulls DStarGateway's reflector list, caching it for the next start. The reflectors below override it by name
[hosts]

[[reflector]]
name = "DCS999"
protocol = "dcs"
address = "192.0.2.10"

# Announces links coming and going, and reads the repeater's status back when someone sends an info request. A Piper voice does the speaking inside
# this program, and it's vocoded through an AMBEserver: the [allstar] one unless ambeserver is set here. The Docker image carries a voice in the default directory
[speech]
# ambeserver = "127.0.0.1:2460"
# voice_directory = "/usr/share/va3ujf/voice"

[allstar]
node = 12345
ambeserver = "127.0.0.1:2460"
message = "AllStar 12345"

# Registering lets other nodes find this one. The node's password is read from the file, to keep it out of this one
[allstar.registration]
password_file = "/etc/va3ujf/allstar_password"

# Posts the node's links to AllStarLink's stats page
[allstar.statpost]

# Nodes can be reached at a fixed address instead of through DNS, which also sets where each is expected to call in from
# [allstar.nodes]
# "54321" = "192.0.2.20:4569"

# Cron times are in the host's timezone. Unlink specific nodes rather than "all", so a schedule never drops a link made by hand
[[allstar.schedule]]
name = "Weekly Net"
cron = "55 18 * * 2"
actions = [{ link = "54321", permanent = true }]

[[allstar.schedule]]
name = "Weekly Net ends"
cron = "0 20 * * 2"
actions = [{ unlink = "54321" }]
