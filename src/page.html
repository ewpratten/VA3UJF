<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{callsign}} hotspot</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --text: #1b1f24; --muted: #667085; --line: #e3e6eb; --good: #1a7f37; --bad: #b42318; --accent: #2457d6; --talk: #fff4d6; --talk-line: #e0a100; --meter: #e3e6eb; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111418; --card: #1a1e24; --text: #e8eaed; --muted: #98a2b3; --line: #2b313a; --good: #4cc26a; --bad: #f97066; --accent: #7a9cff; --talk: #3a3114; --talk-line: #e0a100; --meter: #2b313a; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 8px 0 16px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  #connection { margin-left: auto; font-size: 12px; font-weight: 500; color: var(--muted); }
  #connection::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--bad); }
  #connection.live::before { background: var(--good); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; margin-bottom: 12px; }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 8px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
  .row span:first-child { color: var(--muted); }
  .good { color: var(--good); } .bad { color: var(--bad); } .muted { color: var(--muted); }
  form { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  select, input, button { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
  input { width: 3.5em; text-transform: uppercase; text-align: center; }
  button { background: var(--accent); border-color: var(--accent); color: #fff; cursor: pointer; }
  button.plain { background: var(--card); color: var(--text); border-color: var(--line); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 4px 8px 4px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  .scroll { overflow-x: auto; }
  #flash { color: var(--bad); min-height: 1.4em; margin: 0 0 8px; }

  .card.flush { padding: 0; overflow: hidden; }
  #map { height: 320px; background: var(--line); }
  #map .unavailable { padding: 16px; color: var(--muted); }
  .leaflet-container { font: inherit; }
  .peer-marker { transition: fill .2s; }
  .peer-marker.talking { stroke: var(--talk-line); stroke-width: 4; fill: var(--talk-line); }

  .meter { display: inline-block; vertical-align: middle; width: 120px; height: 10px; border-radius: 5px; background: var(--meter); overflow: hidden; }
  .meter > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--good), var(--talk-line), var(--bad)); background-size: 120px 100%; transition: width .15s ease-out; }
  #flow { width: 100%; height: auto; display: block; }
  #flow text { fill: var(--text); font-size: 13px; }
  #flow text.muted { fill: var(--muted); }
  #flow .node { fill: var(--muted); }
  #flow .node.talking { fill: var(--talk-line); }
  #flow .ribbon { fill: var(--accent); fill-opacity: .4; }
  #flow .ribbon.out { fill-opacity: .2; }
  #flow .ribbon.in { fill: var(--talk-line); fill-opacity: .45; }
  #flow .ribbon.live { animation: flow-pulse 1s ease-in-out infinite; }
  @keyframes flow-pulse { 50% { fill-opacity: .8; } }
  @media (prefers-reduced-motion: reduce) { #flow .ribbon.live { animation: none; fill-opacity: .7; } }
  .legend { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
  #peers tbody tr { cursor: default; }
  #peers tbody tr.has-fix { cursor: pointer; }
  #peers tbody tr.talking { background: var(--talk); box-shadow: inset 3px 0 0 var(--talk-line); }
  #peers tbody tr.offline { color: var(--muted); }
  #peers td.data { font-family: ui-monospace, monospace; font-size: 13px; min-width: 21ch; white-space: pre; }
  .caret { display: inline-block; width: .5em; margin-left: 1px; background: var(--talk-line); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .caret { animation: none; } }

</style>
</head>
<body>
<main>
  <h1>{{callsign}}<span id="connection">Connecting…</span></h1>
  <div id="flash" role="alert"></div>

  <div class="card flush"><div id="map"></div></div>

  <div class="card">
    <h2>Traffic</h2>
    <svg id="flow" viewBox="0 0 900 300" role="img" aria-label="Voice traffic between RF stations, the repeater and its links"></svg>
    <p class="legend">Voice over the last five minutes. Blue is what the repeater heard on RF and passed to the links, and amber is what came in from the links.</p>
  </div>

  <div class="card">
    <h2>Peers</h2>
    <div class="scroll"><table id="peers"><thead><tr><th>Name</th><th>Via</th><th>Level</th><th>BER</th><th>Data</th><th>Last heard</th><th>Keyups</th></tr></thead><tbody></tbody></table></div>
  </div>

  <div class="card">
    <h2>Reflector</h2>
    <div class="row"><span>Link</span><span id="link">…</span></div>
    <form method="post" action="/link">
      <input name="reflector" list="reflectors" placeholder="Reflector" style="width:9em;text-align:left" required aria-label="Reflector">
      <datalist id="reflectors">{{reflector_options}}</datalist>
      <input name="module" maxlength="1" value="A" required aria-label="Module">
      <button>Link</button>
    </form>
    <form method="post" action="/unlink"><button class="plain">Unlink</button></form>
  </div>

  <div class="card" id="allstar-card" hidden>
    <h2>AllStar node <span id="allstar-node"></span></h2>
    <table><tbody id="allstar-links"></tbody></table>
    <form method="post" action="/allstar/link">
      <input name="node" placeholder="Node" style="width:6em" required aria-label="Node">
      <label><input type="checkbox" name="permanent" style="width:auto"> Permanent</label>
      <label><input type="checkbox" name="monitor" style="width:auto"> Monitor</label>
      <button>Link</button>
    </form>
    <h2 style="margin-top:14px">Schedule</h2>
    <table><tbody id="allstar-schedule"></tbody></table>
  </div>

  <div class="card" id="echolink-card" hidden>
    <h2>EchoLink node <span id="echolink-callsign"></span></h2>
    <table><tbody id="echolink-links"></tbody></table>
    <form method="post" action="/echolink/link">
      <input name="station" placeholder="Callsign or ID" style="width:9em" required aria-label="Station">
      <button>Link</button>
    </form>
  </div>

</main>
<script>
  const STATION = { latitude: {{latitude}}, longitude: {{longitude}}, callsign: "{{callsign}}" };
  const SOURCES = { rf: "RF", reflector: "Reflector", allstar: "AllStar node", echolink: "EchoLink station", announcement: "Announcement", ack: "Repeater" };
  
  const sourceName = (source) => SOURCES[source] ?? source;
  const text = (value) => String(value).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const byId = (id) => document.getElementById(id);

  // Replacing what's on the page under someone's finger loses their click, so it's only done when there's something new to show, and not while a button inside is being pressed
  const shown = new WeakMap();
  function setHtml(element, html) {
    if (shown.get(element) === html || element.querySelector(":active")) return;
    element.innerHTML = html;
    shown.set(element, html);
  }

  let snapshot = null;

  // ---- Time ----

  const age = (seconds) => seconds < 5 ? "just now" : seconds < 60 ? `${seconds}s ago` : seconds < 3600 ? `${Math.floor(seconds / 60)}m ago` : seconds < 86400 ? `${Math.floor(seconds / 3600)}h ago` : `${Math.floor(seconds / 86400)}d ago`;
  const duration = (seconds) => seconds < 60 ? `${seconds}s` : `${Math.floor(seconds / 60)}m ${seconds % 60}s`;
  const secondsSince = (unix) => Math.max(0, Math.floor(Date.now() / 1000) - unix);

  // ---- Level ----

  // How loud the voice is, from quiet on the left to loud on the right. It comes from decoding the voice, so every kind of peer has one
  const LEVEL_RANGE_DBFS = [-50, -10];
  const LEVEL_STALE_MS = 800;
  const levels = new Map();

  // Peers reached through a link that reports on them, rather than stations heard directly
  const LINKED_VIA = { allstar: "AllStar", echolink: "EchoLink" };
  const levelKey = (peer) => peer.via in LINKED_VIA ? `source:${peer.via}` : `call:${peer.callsign}`;

  function levelFill(key) {
    const level = levels.get(key);
    if (!level || Date.now() - level.at > LEVEL_STALE_MS) return 0;
    return Math.max(0, Math.min(1, (level.dbfs - LEVEL_RANGE_DBFS[0]) / (LEVEL_RANGE_DBFS[1] - LEVEL_RANGE_DBFS[0])));
  }

  const levelHtml = (peer) => peer.talking ? `<span class="meter" data-meter="${text(levelKey(peer))}"><i style="width:${(levelFill(levelKey(peer)) * 100).toFixed(0)}%"></i></span>` : '<span class="muted">—</span>';

  // Move the bars that are already on the page, so they glide rather than being redrawn
  function moveMeters() {
    document.querySelectorAll("[data-meter]").forEach((meter) => { meter.firstElementChild.style.width = `${(levelFill(meter.dataset.meter) * 100).toFixed(0)}%`; });
  }

  // ---- Map ----

  const map = { instance: null, markers: new Map(), touched: false, repeater: null };

  function startMap() {
    if (!window.L) {
      byId("map").innerHTML = '<div class="unavailable">The map needs to load Leaflet and OpenStreetMap tiles, which needs internet access.</div>';
      return;
    }
    map.instance = L.map("map", { worldCopyJump: true }).setView([STATION.latitude, STATION.longitude], 10);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' }).addTo(map.instance);
    map.repeater = L.circleMarker([STATION.latitude, STATION.longitude], { radius: 9, color: "#2457d6", fillColor: "#2457d6", fillOpacity: 0.9, weight: 3 }).addTo(map.instance).bindTooltip(STATION.callsign, { permanent: true, direction: "top", offset: [0, -8] });
    map.instance.on("dragstart zoomstart", (event) => { if (event.originalEvent || event.type === "dragstart") map.touched = true; });
  }

  function placePeer(peer) {
    if (!map.instance || !peer.fix) return;
    const position = [peer.fix.latitude, peer.fix.longitude];
    let marker = map.markers.get(peer.callsign);
    if (!marker) {
      marker = L.circleMarker(position, { radius: 7, color: "#b54708", fillColor: "#f79009", fillOpacity: 0.85, weight: 2, className: "peer-marker" }).addTo(map.instance);
      marker.bindTooltip(peer.callsign, { direction: "top", offset: [0, -6] });
      map.markers.set(peer.callsign, marker);
      keepInView();
    } else if (!marker.getLatLng().equals(position)) {
      marker.setLatLng(position);
      keepInView();
    }
    marker.setTooltipContent(`${peer.callsign}${peer.fix.comment ? " — " + peer.fix.comment : ""}`);
    marker.getElement()?.classList.toggle("talking", peer.talking);
  }

  // Zoom out to take in everyone, unless someone has moved the map themselves
  function keepInView() {
    if (map.touched) return;
    const points = [map.repeater.getLatLng(), ...[...map.markers.values()].map((marker) => marker.getLatLng())];
    map.instance.fitBounds(L.latLngBounds(points), { padding: [40, 40], maxZoom: 12 });
  }

  // ---- Tickers ----

  // Slow data text arrives a few characters at a time, so it's typed out rather than appearing all at once
  const TICKER_STEP_MS = 35;
  const tickers = new Map();

  function syncTicker(peer) {
    let ticker = tickers.get(peer.callsign);
    if (!ticker) tickers.set(peer.callsign, ticker = { shown: peer.message, target: peer.message });

    // A snapshot can lag behind the events, so it only wins when it isn't an older piece of what's already been heard
    if (peer.message === "" || !ticker.target.startsWith(peer.message)) ticker.target = peer.message;
    if (!ticker.target.startsWith(ticker.shown)) ticker.shown = "";
    return ticker;
  }

  function tickerHtml(peer) {
    const shown = syncTicker(peer).shown;
    return `<span class="ticker-text">${text(shown)}</span>${peer.talking && !(peer.via in LINKED_VIA) ? '<span class="caret">&nbsp;</span>' : ""}`;
  }

  setInterval(() => {
    for (const [callsign, ticker] of tickers) {
      if (ticker.shown === ticker.target) continue;
      ticker.shown = ticker.target.slice(0, ticker.shown.length + 1);
      const selector = `[data-ticker="${CSS.escape(callsign)}"]`;
      document.querySelectorAll(selector).forEach((element) => { element.querySelector(".ticker-text").textContent = ticker.shown; });
    }
  }, TICKER_STEP_MS);

  // ---- Peers ----

  function renderPeers() {
    const peers = [...snapshot.peers].sort((a, b) => b.talking - a.talking || b.last_heard - a.last_heard);
    setHtml(byId("peers").tBodies[0], peers.length ? peers.map((peer) => `<tr class="${peer.talking ? "talking" : ""}${peer.fix ? " has-fix" : ""}${peer.linked === false ? " offline" : ""}" data-callsign="${text(peer.callsign)}">
      <td><b>${text(peer.callsign)}</b></td>
      <td>${sourceName(peer.via)}${peer.linked === false ? " (unlinked)" : ""}</td>
      <td>${levelHtml(peer)}</td>
      <td>${peer.ber_percent === null ? '<span class="muted">—</span>' : peer.ber_percent.toFixed(1) + "%"}</td>
      <td class="data" data-ticker="${text(peer.callsign)}">${tickerHtml(peer)}</td>
      <td data-last-heard="${peer.last_heard}">${peer.talking ? "talking" : age(secondsSince(peer.last_heard))}</td>
      <td title="${duration(peer.seconds)} on the air">${peer.transmissions}</td></tr>`).join("") : '<tr><td class="muted" colspan="7">Nobody heard yet</td></tr>');
    snapshot.peers.forEach(placePeer);
  }

  document.querySelector("#peers tbody").addEventListener("click", (event) => {
    const peer = snapshot?.peers.find((candidate) => candidate.callsign === event.target.closest("tr")?.dataset.callsign);
    if (peer?.fix && map.instance) { map.touched = true; map.instance.flyTo([peer.fix.latitude, peer.fix.longitude], Math.max(map.instance.getZoom(), 11)); }
  });

  // The text a station is sending fills in on its row as it arrives
  function slowData(event) {
    const ticker = event.kind === "text" ? tickers.get(event.callsign) : null;
    if (ticker) ticker.target = event.text;
  }

  // ---- Traffic ----

  const FLOW_WINDOW_SECONDS = 300;
  const FLOW_SOURCES = ["rf", "reflector", "allstar", "echolink"];
  const FLOW_STATIONS_SHOWN = 10;
  const FLOW = { width: 900, height: 300, padding: 22, nodeWidth: 12, leftX: 170, middleX: 444, rightX: 718, minNode: 16, gap: 10, floorUnits: 10 };
  let history = [];

  // How much of a transmission falls inside the window, counting one still going as far as it has got
  function secondsInWindow(transmission, now) {
    const end = Math.min(now, transmission.started_at + transmission.seconds);
    return Math.max(0, end - Math.max(transmission.started_at, now - FLOW_WINDOW_SECONDS));
  }

  // Who has talked to the repeater, and what each connection on the other side has sent and been sent. A reflector is one connection, and so is each node linked into AllStar or station linked into EchoLink
  function flowModel(now) {
    // Only what's said by RF stations and reflectors is in the router's current transmission. Each node or station linked in is followed from the peer list
    const current = snapshot.current && ["rf", "reflector"].includes(snapshot.current.source) ? [{ ...snapshot.current, seconds: now - snapshot.current.started_at, live: true }] : [];
    const nodesTalking = snapshot.peers.filter((peer) => peer.via in LINKED_VIA && peer.talking && peer.talking_since).map((peer) => ({ source: peer.via, callsign: peer.callsign, started_at: peer.talking_since, seconds: now - peer.talking_since, live: true }));
    const recent = history.filter((transmission) => FLOW_SOURCES.includes(transmission.source)).map((transmission) => ({ ...transmission, live: false })).concat(current, nodesTalking)
      .map((transmission) => ({ ...transmission, inWindow: secondsInWindow(transmission, now) })).filter((transmission) => transmission.inWindow > 0);

    const left = new Map();
    recent.filter((transmission) => transmission.source === "rf").forEach((transmission) => {
      const station = left.get(transmission.callsign) ?? { name: transmission.callsign, seconds: 0, weight: 1, talking: false };
      station.seconds += transmission.inWindow;
      station.talking ||= transmission.live;
      left.set(transmission.callsign, station);
    });

    const connections = [];
    snapshot.links.filter((link) => link.connected && FLOW_SOURCES.includes(link.kind)).forEach((link) => {
      if (link.kind in LINKED_VIA) link.peers.filter((peer) => peer.connected).forEach((peer) => connections.push({ name: `${LINKED_VIA[link.kind]} ${peer.id}`, owns: (transmission) => transmission.source === link.kind && transmission.callsign === peer.id }));
      else connections.push({ name: link.target ?? link.kind, owns: (transmission) => transmission.source === link.kind });
    });
    const total = recent.reduce((sum, transmission) => sum + transmission.inWindow, 0);
    const links = connections.map((connection) => {
      const heard = recent.filter(connection.owns);
      const received = heard.reduce((sum, transmission) => sum + transmission.inWindow, 0);
      return { name: connection.name, talking: heard.some((transmission) => transmission.live), received, sent: total - received, receivedWeight: received > 0 ? 1 : 0, sentWeight: total - received > 0 ? 1 : 0, liveSources: recent.some((transmission) => transmission.live && !connection.owns(transmission)) };
    });
    const stations = [...left.values()].sort((a, b) => b.seconds - a.seconds);

    // A busy repeater would otherwise need a chart too tall to read
    if (stations.length > FLOW_STATIONS_SHOWN) {
      const others = stations.splice(FLOW_STATIONS_SHOWN - 1);
      stations.push({ name: `${others.length} others`, seconds: others.reduce((sum, station) => sum + station.seconds, 0), weight: 1, talking: others.some((station) => station.talking) });
    }
    return { left: stations, links, repeater: STATION.callsign };
  }

  // Nodes and ribbons for the chart. Every flow is the same thickness, however long it has gone on, and voice is copied to every connection, so the right side can be taller than the left
  function flowLayout(model) {
    const { padding, nodeWidth, leftX, middleX, rightX, minNode, gap, floorUnits } = FLOW;

    // The drawing grows if there are more rows than fit, so every node can keep its minimum size
    const height = Math.max(FLOW.height, 2 * padding + Math.max(model.left.length, model.links.length) * (minNode + gap));
    const leftTotal = model.left.reduce((sum, station) => sum + station.weight, 0);
    const rightTotal = model.links.reduce((sum, link) => sum + link.receivedWeight + link.sentWeight, 0);
    const room = height - 2 * padding;

    // Pick a scale where both columns fit, with their gaps and the minimum size of a node
    let scale = room / Math.max(leftTotal, rightTotal, floorUnits);
    const columnHeight = (sizes) => sizes.reduce((sum, size) => sum + Math.max(minNode, size * scale), 0) + gap * Math.max(0, sizes.length - 1);
    const leftSizes = model.left.map((station) => station.weight), rightSizes = model.links.map((link) => link.receivedWeight + link.sentWeight);
    for (let attempt = 0; attempt < 8 && Math.max(columnHeight(leftSizes), columnHeight(rightSizes)) > room; attempt++) scale *= room / Math.max(columnHeight(leftSizes), columnHeight(rightSizes)) * 0.97;

    const nodes = [], ribbons = [];
    const stack = (sizes) => { let y = (height - columnHeight(sizes)) / 2; return sizes.map((size) => { const h = Math.max(minNode, size * scale); const top = y; y += h + gap; return { top, h }; }); };
    const middleHeight = Math.max(minNode * 2, leftTotal * scale, rightTotal * scale);
    const middleTop = (height - middleHeight) / 2;
    const ribbon = (fromX, fromY, toX, toY, thickness, kind, live, title) => {
      const t = Math.max(1.5, thickness), mid = (fromX + toX) / 2;
      ribbons.push({ kind, live, title, path: `M${fromX},${fromY} C${mid},${fromY} ${mid},${toY} ${toX},${toY} L${toX},${toY + t} C${mid},${toY + t} ${mid},${fromY + t} ${fromX},${fromY + t} Z` });
    };

    // RF stations on the left, into the repeater
    let intake = middleTop + (middleHeight - leftTotal * scale) / 2;
    stack(leftSizes).forEach((slot, index) => {
      const station = model.left[index], thickness = station.weight * scale;
      nodes.push({ side: "left", x: leftX, y: slot.top, h: slot.h, label: station.name, talking: station.talking });
      ribbon(leftX + nodeWidth, slot.top + (slot.h - Math.max(1.5, thickness)) / 2, middleX, intake, thickness, "rf", station.talking, `${station.name}: ${Math.round(station.seconds)}s`);
      intake += thickness;
    });

    // Connections on the right, each with what's sent out to it and what comes in from it
    let edge = middleTop + (middleHeight - rightTotal * scale) / 2;
    stack(rightSizes).forEach((slot, index) => {
      const link = model.links[index], outThickness = link.sentWeight * scale, inThickness = link.receivedWeight * scale;
      const inner = slot.top + (slot.h - (outThickness + inThickness)) / 2;
      nodes.push({ side: "right", x: rightX, y: slot.top, h: slot.h, label: link.name, talking: link.talking });
      if (link.sentWeight > 0) ribbon(middleX + nodeWidth, edge, rightX, inner, outThickness, "out", link.liveSources, `To ${link.name}: ${Math.round(link.sent)}s`);
      if (link.receivedWeight > 0) ribbon(middleX + nodeWidth, edge + outThickness, rightX, inner + outThickness, inThickness, "in", link.talking, `From ${link.name}: ${Math.round(link.received)}s`);
      edge += outThickness + inThickness;
    });
    nodes.push({ side: "middle", x: middleX, y: middleTop, h: middleHeight, label: model.repeater, talking: model.left.some((station) => station.talking) || model.links.some((link) => link.talking) });
    return { nodes, ribbons, height };
  }

  const clip = (label, length = 20) => label.length > length ? label.slice(0, length - 1) + "…" : label;

  function renderFlow() {
    if (!snapshot) return;
    const model = flowModel(Date.now() / 1000);
    const { nodes, ribbons, height } = flowLayout(model);
    byId("flow").setAttribute("viewBox", `0 0 ${FLOW.width} ${height}`);
    const labels = nodes.map((node) => {
      const y = node.y + node.h / 2 + 4;
      if (node.side === "left") return `<text x="${node.x - 8}" y="${y}" text-anchor="end">${text(clip(node.label))}</text>`;
      if (node.side === "right") return `<text x="${node.x + FLOW.nodeWidth + 8}" y="${y}">${text(clip(node.label))}</text>`;
      return `<text x="${node.x + FLOW.nodeWidth / 2}" y="${node.y - 8}" text-anchor="middle">${text(node.label)}</text>`;
    });
    const notes = [model.left.length ? "" : `<text class="muted" x="${FLOW.leftX - 8}" y="${height / 2 + 4}" text-anchor="end">No RF in the last 5 minutes</text>`, model.links.length ? "" : `<text class="muted" x="${FLOW.rightX + FLOW.nodeWidth + 8}" y="${height / 2 + 4}">No active links</text>`];
    setHtml(byId("flow"), ribbons.map((ribbon) => `<path class="ribbon ${ribbon.kind}${ribbon.live ? " live" : ""}" d="${ribbon.path}"><title>${text(ribbon.title)}</title></path>`).join("")
      + nodes.map((node) => `<rect class="node${node.talking ? " talking" : ""}" x="${node.x}" y="${node.y}" width="${FLOW.nodeWidth}" height="${node.h}" rx="2"></rect>`).join("") + labels.join("") + notes.join(""));
  }

  // ---- Everything else ----

  function renderLinks() {
    const reflector = snapshot.links.find((link) => link.kind === "reflector") ?? { target: null };
    setHtml(byId("link"), !reflector.target ? "Not linked" : reflector.connected ? `<span class="good">Linked to ${text(reflector.target)}</span>` : `<span class="bad">Linking ${text(reflector.target)}…</span>`);
    const peerState = (peer) => !peer.connected ? "Connecting…" : peer.keyed ? "Keyed" : "Idle";
    const peerRows = (kind, action, field) => {
      const peers = (snapshot.links.find((link) => link.kind === kind) ?? { peers: [] }).peers;
      return peers.length ? peers.map((peer) => `<tr><td>${text(peer.id)}</td><td>${peer.mode}, ${peer.outbound ? "outbound" : "inbound"}</td><td>${peerState(peer)}</td><td style="text-align:right"><form method="post" action="${action}" style="margin:0"><input type="hidden" name="${field}" value="${text(peer.id)}"><button class="plain">Unlink</button></form></td></tr>`).join("") : '<tr><td class="muted">Not linked</td></tr>';
    };
    const echolink = snapshot.echolink;
    byId("echolink-card").hidden = !echolink;
    if (echolink) {
      byId("echolink-callsign").textContent = echolink.callsign;
      setHtml(byId("echolink-links"), peerRows("echolink", "/echolink/unlink", "station"));
    }
    const allstar = snapshot.allstar;
    byId("allstar-card").hidden = !allstar;
    if (!allstar) return;
    byId("allstar-node").textContent = allstar.node;
    setHtml(byId("allstar-links"), peerRows("allstar", "/allstar/unlink", "node"));
    setHtml(byId("allstar-schedule"), allstar.schedule.map((run) => `<tr><td>${text(run.name)}</td><td>${new Date(run.next_at * 1000).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" })}</td></tr>`).join(""));
  }

  function render() {
    renderPeers();
    renderLinks();
    renderFlow();
  }

  function handle(message) {
    switch (message.type) {
      case "snapshot": snapshot = message.snapshot; render(); break;
      case "level":
        levels.set(`call:${message.callsign}`, { dbfs: message.dbfs, at: Date.now() });
        levels.set(`source:${message.source}`, { dbfs: message.dbfs, at: Date.now() });
        moveMeters();
        break;
      case "slow_data": slowData(message); break;
      case "history": history = message.transmissions; renderFlow(); break;
      case "transmission": history.push(message); renderFlow(); break;
      case "position": {
        const peer = snapshot?.peers.find((candidate) => candidate.callsign === message.callsign);
        if (peer) { peer.fix = { latitude: message.latitude, longitude: message.longitude, comment: message.comment }; placePeer(peer); }
        break;
      }
      case "quality": {
        const peer = snapshot?.peers.find((candidate) => candidate.callsign === message.callsign);
        if (peer) { peer.ber_percent = message.ber_percent; peer.dbm = message.dbm; renderPeers(); }
        break;
      }
    }
  }

  // Forms act on the hotspot without leaving the page
  document.addEventListener("submit", async (event) => {
    event.preventDefault();
    const form = event.target;
    const response = await fetch(form.action, { method: "POST", body: new URLSearchParams(new FormData(form)) });
    byId("flash").textContent = response.ok ? "" : await response.text();
  });

  // Keep times and the elapsed counter moving between updates
  setInterval(moveMeters, 250);

  setInterval(() => {
    document.querySelectorAll("[data-last-heard]").forEach((cell) => { if (!cell.parentElement.classList.contains("talking")) cell.textContent = age(secondsSince(Number(cell.dataset.lastHeard))); });
    renderFlow();
  }, 1000);

  // The page stays live by reconnecting whenever the hotspot restarts or the network drops
  function connect() {
    const socket = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/live`);
    socket.onopen = () => { byId("connection").textContent = "Live"; byId("connection").classList.add("live"); };
    socket.onmessage = (event) => handle(JSON.parse(event.data));
    socket.onclose = () => { byId("connection").textContent = "Reconnecting…"; byId("connection").classList.remove("live"); setTimeout(connect, 2000); };
  }

  startMap();
  connect();
</script>
</body>
</html>
