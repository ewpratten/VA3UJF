[package]
name = "va3ujf"
description = "Single-binary D-STAR hotspot: MMDVM modem driver, reflector links, and APRS-IS beaconing"
authors = ["Evan Pratten <evan@ewpratten.com>"]
version = "0.1.0"
edition = "2024"

# This runs on the hotspot's host (see stacks/mmdvm), so ewconfig's install.sh must not install it locally
[package.metadata.ewconfig]
install = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
clap-verbosity-flag = "3.0.4"
croner = "4.0.2"
fern = "0.7.1"
hickory-resolver = "0.26.3"
log = "0.4.34"
prometheus = { version = "0.14", default-features = false }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
# 2.0 dropped the espeak-ng phonemizer that Piper voices need, so this stays on the last 1.x
sherpa-onnx = "=1.13.8"
serde_json = "1.0.154"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync", "io-util", "signal", "fs", "process"] }
tokio-serial = "5"
toml = "1.1.6"
crc = "3.4.0"
zerocopy = { version = "0.8.63", features = ["derive"] }
audio-codec-algorithms = "0.8.1"
oxideav-gsm = "0.0.10"
rig-core = { version = "0.37", default-features = false, features = ["rustls", "derive"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
hmac = "0.13.0"
sha2 = "0.11.1"
getrandom = "0.4.3"
hex = "0.4.3"

[dev-dependencies]
tokio-tungstenite = "0.29"
